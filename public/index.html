<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cấp Key Kích Hoạt</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 32px auto;
      padding: 0 16px;
      color: #1e293b;
      background: #f8fafc;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    h2 {
      text-align: center;
      margin: 0 0 20px 0;
      font-size: 22px;
      color: #0f172a;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-top: 12px;
      display: block;
    }
    input, button, textarea {
      width: 100%;
      padding: 12px;
      margin: 6px 0 12px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    button {
      background: #2563eb;
      color: #fff;
      border: 0;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .btn-copy {
      background: #059669;
      margin-top: 4px;
    }
    .btn-copy:hover {
      background: #047857;
    }
    textarea {
      height: 120px;
      word-break: break-all;
      resize: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      background: #f1f5f9;
      color: #0f172a;
    }
    .status {
      font-size: 14px;
      min-height: 22px;
      text-align: center;
      margin: -4px 0 10px;
      font-weight: 500;
    }
    .status.error { color: #dc2626; }
    .status.success { color: #16a34a; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔑 Cấp Key Kích Hoạt</h2>
    
    <label for="pw">Mật khẩu quản trị:</label>
    <input id="pw" type="password" placeholder="Nhập mật khẩu admin..." autocomplete="current-password">

    <label for="dev">Device ID (từ ứng dụng):</label>
    <input id="dev" placeholder="Ví dụ: a1b2c3d4e5f6..." autocomplete="off">

    <button id="btnGen" onclick="gen()">Tạo key kích hoạt</button>
    <div id="status" class="status"></div>

    <label for="out">Key kích hoạt:</label>
    <textarea id="out" readonly placeholder="Key sẽ hiển thị tại đây..."></textarea>
    <button id="btnCopy" class="btn-copy" onclick="copyKey()">📋 Copy Key</button>
  </div>

  <script>
    const pwInput = document.getElementById("pw");
    const devInput = document.getElementById("dev");
    const out = document.getElementById("out");
    const statusEl = document.getElementById("status");
    const btnGen = document.getElementById("btnGen");
    const btnCopy = document.getElementById("btnCopy");

    // Khôi phục mật khẩu đã lưu hoặc dùng mặc định Minhyang18@@
    pwInput.value = localStorage.getItem("capkey_admin_pw") || "Minhyang18@@";

    // Hỗ trợ nhấn Enter để tạo key
    [pwInput, devInput].forEach(el => {
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") gen();
      });
    });

    async function gen() {
      const pw = pwInput.value.trim();
      const dev = devInput.value.trim();

      if (!pw) return showStatus("Vui lòng nhập mật khẩu admin!", "error");
      if (!dev) return showStatus("Vui lòng nhập Device ID!", "error");

      // Lưu mật khẩu cho lần sau
      localStorage.setItem("capkey_admin_pw", pw);

      btnGen.disabled = true;
      btnGen.innerText = "⏳ Đang tạo key...";
      statusEl.innerText = "";
      out.value = "";

      try {
        const res = await fetch("/api/sign", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ deviceId: dev, password: pw })
        });

        const data = await res.json();
        if (!res.ok || data.error) {
          throw new Error(data.error || "Không thể tạo key");
        }

        out.value = data.key;
        showStatus("✅ Đã tạo key thành công!", "success");
      } catch (err) {
        showStatus(err.message, "error");
      } finally {
        btnGen.disabled = false;
        btnGen.innerText = "Tạo key kích hoạt";
      }
    }

    function showStatus(msg, type) {
      statusEl.className = "status " + type;
      statusEl.innerText = msg;
    }

    async function copyKey() {
      const key = out.value.trim();
      if (!key) return showStatus("Chưa có key để copy!", "error");

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(key);
        } else {
          out.select();
          document.execCommand("copy");
        }
        btnCopy.innerText = "✅ Đã copy vào bộ nhớ tạm!";
        setTimeout(() => { btnCopy.innerText = "📋 Copy Key"; }, 2500);
      } catch (e) {
        out.select();
        showStatus("Vui lòng bôi đen và nhấn Ctrl+C để copy", "error");
      }
    }
  </script>
</body>
</html>
